version: '3.8'

# ============================================================================
# Kinderfestival Turnierplaner - Docker Compose Configuration
# ============================================================================

services:
  # Hauptanwendung
  turnierplaner:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production
    container_name: kinderfestival-turnierplaner
    hostname: turnierplaner
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8443:8443"
    environment:
      # Application Settings
      - NODE_ENV=production
      - APP_NAME=Kinderfestival Turnierplaner
      - APP_VERSION=1.0.0
      - APP_PORT=8080
      
      # Security Settings
      - NGINX_ENABLE_HTTPS=false
      - NGINX_HTTP_PORT=8080
      - NGINX_HTTPS_PORT=8443
      
      # Logging
      - LOG_LEVEL=info
      - LOG_FORMAT=combined
    volumes:
      # Persistente Daten (falls benötigt für zukünftige Backend-Integration)
      - ./data:/var/www/data
      # SSL Zertifikate
      - ./certs:/etc/nginx/certs:ro
      # Nginx Konfiguration
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - turnierplaner-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.turnierplaner.rule=Host(`turnierplaner.localhost`)"
      - "traefik.http.routers.turnierplaner.entrypoints=web"
      - "traefik.http.services.turnierplaner.loadbalancer.server.port=8080"
    
    # Entwicklungsumgebung
    # Override mit: docker compose -f compose.yaml -f compose.dev.yaml up
    profiles:
      - production

  # Entwicklungsserver (optional)
  dev-server:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: kinderfestival-turnierplaner-dev
    hostname: turnierplaner-dev
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - VITE_APP_PORT=5173
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - turnierplaner-network
    profiles:
      - development

# ============================================================================
# NETWORK
# ============================================================================

networks:
  turnierplaner-network:
    name: kinderfestival-turnierplaner-network
    driver: bridge
    internal: false

# ============================================================================
# VOLUMES
# ============================================================================

volumes:
  # Persistente Daten
  turnierplaner-data:
    name: kinderfestival-turnierplaner-data
    driver: local
