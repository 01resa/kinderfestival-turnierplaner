version: '3.8'

# ============================================================================
# Kinderfestival Turnierplaner - Docker Compose Configuration
# ============================================================================

services:
  # Produktionsanwendung
  turnierplaner:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production
    container_name: kinderfestival-turnierplaner
    hostname: turnierplaner
    restart: unless-stopped
    ports:
      - "4654:4654"
    environment:
      # Application Settings
      - NODE_ENV=production
      - APP_NAME=Kinderfestival Turnierplaner
      - APP_VERSION=1.0.0
      - APP_PORT=4654
      
      # Security Settings
      - NGINX_ENABLE_HTTPS=false
      - NGINX_HTTP_PORT=4654
      
      # Logging
      - LOG_LEVEL=info
    volumes:
      # Static files for development hot reload
      - ./dist:/usr/share/nginx/html:ro
      # SSL Zertifikate (optional)
      - ./certs:/etc/nginx/certs:ro
      # Nginx Konfiguration
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - turnierplaner-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4654"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    profiles:
      - production

  # Entwicklungsserver
  dev-server:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: kinderfestival-turnierplaner-dev
    hostname: turnierplaner-dev
    restart: unless-stopped
    ports:
      - "4654:4654"
    environment:
      - NODE_ENV=development
      - VITE_APP_PORT=4654
      - HMR_HOST=0.0.0.0
    volumes:
      # Source code for hot reload
      - .:/app
      # Node modules volume to persist dependencies
      - node_modules:/app/node_modules
    networks:
      - turnierplaner-network
    profiles:
      - development
    # Use host network for HMR to work properly
    extra_hosts:
      - "host.docker.internal:host-gateway"

# ============================================================================
# NETWORK
# ============================================================================

networks:
  turnierplaner-network:
    name: kinderfestival-turnierplaner-network
    driver: bridge

# ============================================================================
# VOLUMES
# ============================================================================

volumes:
  node_modules:
